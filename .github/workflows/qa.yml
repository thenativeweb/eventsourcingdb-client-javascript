name: QA

on: pull_request

concurrency:
  group: qa-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (${{ matrix.image-tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image-tag:
          - latest
          - preview

    steps:
    - name: Clone repository
      uses: actions/checkout@v7.0.1
    - name: Use Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.nvmrc'
    - name: Install dependencies
      run: |
        npm ci
    - name: Run QA
      env:
        EVENTSOURCINGDB_IMAGE_TAG: ${{ matrix.image-tag }}
      run: |
        npm run qa
    - name: Run build
      run: |
        npm run build
